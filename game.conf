# game.conf: what tools/native-build.sh needs to know about this game. No game data in here.
TITLE="Mario Kart 8"
NAME=mk8
RPX=Turbo.rpx
TESTED_TITLE_ID=000500001010ED00
TESTED_REGION="Europe"
RECOMP_ARGS="--any-rpx"
# Its video player module mvplayer.rpl is translated too and loaded by port/modules.cpp.
MODULES=mk8
NEEDS_FILES=mvplayer.rpl
CXX_DEFINES="-DCAFE_PORT_MODULES"
BUILD_MINUTES=5-15
DISK_GB=2
# Needed: the Mii resource title (0005001B-10056000) of your own Wii U.
SYS_TITLES=10056000
SYS_NOTE_DE="WICHTIG: Ohne die Mii-Dateien deiner eigenen Wii U (-SysDir / --sys, Ordner mlc01/sys) kommt Mario Kart 8 nicht ins Spiel."
SYS_NOTE_EN="IMPORTANT: without the Mii files of your own Wii U (-SysDir / --sys, an mlc01/sys folder) Mario Kart 8 does not get into the game."
